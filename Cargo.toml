[package]
name = "versorc-math"
version = "0.1.2"
edition = "2021"
rust-version = "1.87"
authors = ["The VersorC Project Contributors <zeph.systems@proton.me>"]
description = "Low-level Clifford Geometric Algebra, Versor Operators, and High-Dimensional Matrix Reductions"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/versorc/versorc-math"
homepage = "https://github.com/versorc/versorc-math"
documentation = "https://docs.rs/versorc-math"
keywords = ["geometric-algebra", "clifford", "versor", "quaternion", "math"]
categories = ["mathematics", "science"]
exclude = [
    "literature/*",
    "assets/*",
    "vendor_reference/*",
    "explanations/*",
    "*.djvu",
    "*.pdf",
]

[lib]
name = "versorc_math"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }
bytemuck = { version = "1.18", features = ["derive"], optional = true }
pyo3 = { version = "0.26", features = ["extension-module"], optional = true }

[dev-dependencies]

[features]
default = []
serde = ["dep:serde"]
vulkan = ["dep:ash", "dep:bytemuck"]
python = ["dep:pyo3"]
