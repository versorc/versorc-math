<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersorC-Math · 3D PGA SE(3) Screw Kinematics & Motor Action</title>
  <script src="https://cdn.jsdelivr.net/npm/ganja.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e6ed;
    }
    #header {
      position: absolute;
      top: 14px;
      left: 18px;
      z-index: 100;
      pointer-events: none;
      background: rgba(16, 20, 31, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    #header p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #8da2be;
    }
    #canvas-container {
      width: 100%;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>VersorC-Math · 3D PGA SE(3) Screw Kinematics & Motor Action</h1>
    <p>Clifford Algebra Cl(3, 0, 1) · Drag with left/right mouse button to orbit/pan</p>
  </div>
  <div id="canvas-container"></div>

  <script>
    Algebra(3, 0, 1, function() {
      
      // Base Euclidean Points
      var origin = !(1e0);
      var pX = !(1e0 + 1.2*1e1);
      var pY = !(1e0 + 1.2*1e2);
      var pZ = !(1e0 + 1.2*1e3);

      // Target motor parameters
      var tx = 2.0, ty = 1.2, tz = 1.5;
      var axis = [ 0.0, 0.0, 1.0 ];
      var totalAngle = 3.14159;

      // Continuous animated motor M(t)
      var motor = ()=>{
        var time = (Date.now() * 0.001) % 4.0;
        var t = 0.5 * (1.0 - Math.cos(time * Math.PI * 0.5)); // smooth oscillation
        var ang = t * totalAngle * 0.5;
        var c = Math.cos(ang), s = Math.sin(ang);
        
        // Rotor around axis
        var R = c - s * (axis[0]*1e23 + axis[1]*1e31 + axis[2]*1e12);
        // Translator along vector
        var T = 1 - 0.5 * t * (tx*1e01 + ty*1e02 + tz*1e03);
        // Rigid motor M = T * R
        return T * R;
      };
    
      
      var scene = [
        0x334455aa,
        1e2,
        0x00ff3333,
        "World X",
        origin & pX,
        0x0033cc33,
        "World Y",
        origin & pY,
        0x003388ff,
        "World Z",
        origin & pZ,
        0x00ffaa00,
        "Rigid Body",
        ()=> motor() * origin * ~motor(),
        0x00ff4444,
        ()=> motor() * (origin & pX) * ~motor(),
        0x0044ff44,
        ()=> motor() * (origin & pY) * ~motor(),
        0x0044aaff,
        ()=> motor() * (origin & pZ) * ~motor(),
        0x00aa44ff,
        "Screw Axis",
        !(1e0) & !(1e0 + 0.0*1e1 + 0.0*1e2 + 1.0*1e3)
      ];

      var graphElement = this.graph(scene, {
        animate: true,
        camera: [0.0, 0.0, -5.0],
        gl: true
      });

      document.getElementById('canvas-container').appendChild(graphElement);
    });
  </script>
</body>
</html>
