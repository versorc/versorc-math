<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VersorC-Math · 3D Euclidean GA Cl(3,0) Bivector Blade & Rotor Orbit</title>
  <script src="https://cdn.jsdelivr.net/npm/ganja.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e6ed;
    }
    #header {
      position: absolute;
      top: 14px;
      left: 18px;
      z-index: 100;
      pointer-events: none;
      background: rgba(16, 20, 31, 0.75);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    #header p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #8da2be;
    }
    #canvas-container {
      width: 100%;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>VersorC-Math · 3D Euclidean GA Cl(3,0) Bivector Blade & Rotor Orbit</h1>
    <p>Clifford Algebra Cl(3, 0, 0) · Drag with left/right mouse button to orbit/pan</p>
  </div>
  <div id="canvas-container"></div>

  <script>
    Algebra(3, 0, 0, function() {
      
      var u = 1.8*1e1 + 0.0*1e2 + 0.0*1e3;
      var v = 0.0*1e1 + 1.8*1e2 + 0.0*1e3;
      var B = u ^ v; // 2-blade bivector

      // Unit bivector plane normal
      var B_norm = Math.sqrt(Math.abs((B * B).s || 1.0));
      var B_unit = B * (1.0 / B_norm);

      // Rotating vector v(t) = R(t) * u * ~R(t)
      var rotatingVector = ()=>{
        var t = Date.now() * 0.002;
        var c = Math.cos(t * 0.5);
        var s = Math.sin(t * 0.5);
        var R = c - s * B_unit; // Clifford rotor exp(-B*t/2)
        return R * u * ~R;
      };
    
      
      var scene = [
        0x00888888,
        [0, 0, 0],
        0x00ff4444,
        "Vector u",
        [ [0,0,0], u ],
        0x0044ff44,
        "Vector v",
        [ [0,0,0], v ],
        0x442288ff,
        "Bivector 2-Blade u \u2227 v",
        B,
        0x00ffaa00,
        "Rotor Action v(t) = R u R~",
        ()=> [ [0,0,0], rotatingVector() ]
      ];

      var graphElement = this.graph(scene, {
        animate: true,
        camera: [0.0, 0.0, -4.5],
        gl: true
      });

      document.getElementById('canvas-container').appendChild(graphElement);
    });
  </script>
</body>
</html>
